[build-systems]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "minisearch"
version = "0.1.0"
description = "BM25 search engine built from scratch in Python"
requires-python = ">=3.10"
[tool.setuptools.packages.find]
where= ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
